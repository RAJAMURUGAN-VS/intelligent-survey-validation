<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sentinel-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sentinel — Intelligent Survey Data Validation Platform for India's National Statistical Office. Detect anomalies in PLFS data using probabilistic and ML techniques." />
    <meta name="keywords" content="PLFS, NSO, survey validation, anomaly detection, machine learning, India statistics" />
    <title>Sentinel — Intelligent Survey Data Validation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <div id="error-log" style="position:fixed;top:0;left:0;width:100%;background:red;color:white;z-index:9999;padding:20px;display:none;font-family:monospace;white-space:pre-wrap;"></div>
    <script>
      window.addEventListener('error', (event) => {
        document.getElementById('error-log').style.display = 'block';
        document.getElementById('error-log').innerText += 'ERROR: ' + event.message + '\n' + (event.error && event.error.stack ? event.error.stack : '') + '\n\n';
      });
      window.addEventListener('unhandledrejection', (event) => {
        document.getElementById('error-log').style.display = 'block';
        document.getElementById('error-log').innerText += 'PROMISE REJECTION: ' + event.reason + '\n\n';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
